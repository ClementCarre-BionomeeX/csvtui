name: Release

# Fires when a version tag is pushed. Builds a binary per platform, checks it
# actually runs, and attaches the lot to a GitHub release.
on:
  push:
    tags: ["v*"]
  # So the build can be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-13
            name: macos-x86_64
          - os: macos-latest
            name: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # A binary that cannot start is worse than no binary: it turns a download
      # into a bug report. There is no TTY here so the viewer cannot be driven,
      # but --version and --help exercise startup, and the version has to agree
      # with the tag or the release is mislabelled.
      - name: Check the binary runs
        shell: bash
        run: |
          set -euo pipefail
          ./build/csvtui --help > /dev/null
          reported="$(./build/csvtui --version)"
          echo "reports: $reported"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            expected="csvtui ${GITHUB_REF_NAME#v}"
            if [[ "$reported" != "$expected" ]]; then
              echo "tag says '${GITHUB_REF_NAME}' but the binary says '$reported'" >&2
              echo "bump project(VERSION) in CMakeLists.txt to match the tag" >&2
              exit 1
            fi
          fi

      - name: Package
        run: |
          mkdir -p dist/csvtui-${{ matrix.name }}
          cp build/csvtui dist/csvtui-${{ matrix.name }}/
          cp README.md CHANGELOG.md LICENSE dist/csvtui-${{ matrix.name }}/
          cp doc/csvtui.1 dist/csvtui-${{ matrix.name }}/
          cd dist && tar czf csvtui-${{ matrix.name }}.tar.gz csvtui-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: csvtui-${{ matrix.name }}
          path: dist/csvtui-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          # The section of the changelog for this tag, so the release page says
          # what changed rather than repeating the commit log.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '
            $0 ~ "^" v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
          head -20 notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
